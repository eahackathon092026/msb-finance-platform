# MẪU — KHÔNG điền mật khẩu thật vào file này rồi commit.
# Tạo secret thật bằng lệnh (chuỗi kết nối không bao giờ nằm trong repo):
#
#   export DATABASE_URL='postgresql://anhnv20:PASSWORD@DB_HOST:5432/ea-hackathon?sslmode=require'
#   make k8s-db-secret
#
# Hoặc trực tiếp:
#   kubectl -n finance-demo create secret generic guardian-db \
#     --from-literal=DATABASE_URL="$DATABASE_URL"
apiVersion: v1
kind: Secret
metadata:
  name: guardian-db
  namespace: finance-demo
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/ea-hackathon?sslmode=require"
