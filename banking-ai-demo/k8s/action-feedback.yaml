apiVersion: apps/v1
kind: Deployment
metadata:
  name: action-feedback-service
  namespace: finance-demo
  labels:
    app: action-feedback-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: action-feedback-service
  template:
    metadata:
      labels:
        app: action-feedback-service
    spec:
      imagePullSecrets:
        - name: vcr-cred
      containers:
        - name: action-feedback-service
          # CI thay :latest bằng commit SHA (xem README).
          image: vcr.vngcloud.vn/114544-ea-hackathon/action-feedback-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: action-feedback-service
  namespace: finance-demo
  labels:
    app: action-feedback-service
spec:
  type: ClusterIP
  selector:
    app: action-feedback-service
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
